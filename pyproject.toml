[project]
name = "ephemeral-chains"
version = "0.1.0"
description = "Code for the paper: Ephemeral Chains for Adaptive Multichain Blockchains"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
nevergrad = ["nevergrad>=1.0"]
dev = ["pytest>=7", "matplotlib>=3.7", "pandas>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ephemeral_chains*"]
